[package]
name         = "strixmaid-node"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true

# 一台主机的完整 API（`design.md` §11 的 AgentCore 宿主面）。
#
# core 是「能力库」——providers、worker、session、metrics、store，每一项都不知道
# HTTP 的存在。本 crate 是「把能力做成 API」：axum Router、认证与会话、审计、
# WS 频道、Windows 服务托管。`strixmaid` 的两种模式（`serve` / `agent`）装载
# 同一份，因此它们提供逐字节相同的 API。
#
# 这条边界由**依赖表**守着：core 的 Cargo.toml 里没有 axum，想 use 也 use 不到。
# 详见 `docs/roadmap/10-node-layer.md` §3.1。

[features]
# 在 release 构建中也暴露 OpenAPI 文档端点（/api/v1/openapi.json 与 /api/docs）
# 与 /debug 页。debug 构建无条件暴露，无需此 feature；见 src/apidoc.rs。
#
# 注意：utoipa-scalar 刻意保持为非可选依赖。gate 条件是
# `any(debug_assertions, feature = "apidoc")`，而 feature 无法被 debug_assertions
# 自动打开，若把它标成 optional，debug 构建就会缺依赖。真正占体积的是
# src/vendor/scalar.standalone.js（约 3.7 MiB），那份 include_bytes! 在被 gate 掉的
# 模块里，关掉时一个字节都不会进二进制；utoipa-scalar 本身只有十几行代码，
# 在未被引用时由 LTO 剥除。
apidoc = []

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws", "macros"] }
# 服务子命令的参数形状（`service install --account …`）随实现一起放在这里，
# 免得两个宿主各抄一份 derive。
clap = { version = "4.6.6", features = ["derive", "env"] }
futures = "0.3.34"
hex = "0.4.3"
hyper = { version = "1.11.1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
strixmaid-core = { version = "0.1.0", path = "../strixmaid-core" }
strixmaid-types = { version = "0.1.0", path = "../strixmaid-types" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "net", "sync", "time", "io-util"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["trace", "compression-gzip", "cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa = { version = "5.5.0", features = ["axum_extras"] }
utoipa-axum = "0.2.0"
utoipa-scalar = { version = "0.3.0", features = ["axum"] }

# Windows 服务（SCM）：被 SCM 拉起时要向它报告状态并接受停止请求，
# `service install` 等子命令反过来调用 SCM。见 src/winsvc/。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Services",
] }

[dev-dependencies]
tokio-tungstenite = "0.30.0"
