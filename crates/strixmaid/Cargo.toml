[package]
name         = "strixmaid"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true

# §2.1：产物就叫 `strixmaid`（UI + AgentCore + Server + worker 模式的单一二进制）。
[[bin]]
name = "strixmaid"
path = "src/main.rs"

[features]
default = ["ui"]
# 嵌入 web/dist 前端并提供 SPA 回退（§2.1）。关闭（--no-default-features）
# 产出无 UI 的精简变体：全部非 /api、/ws 路径返回 404 JSON。
ui = []
# 在 release 构建中也暴露 OpenAPI 文档端点（/api/v1/openapi.json 与 /api/docs）。
# debug 构建无条件暴露，无需此 feature；见 src/apidoc.rs。
#
# 文档端点与 /debug 页的实现都在 strixmaid-node 里，所以必须把 feature 转发过去：
# 只开自己这一个，node 那边仍然是关的，gate 两边不同步。
apidoc = ["strixmaid-node/apidoc"]

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws", "macros"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
figment = { version = "0.10.19", features = ["toml", "env"] }
futures = "0.3.34"
mime_guess = "2.0.5"
rand = "0.10.2"
rust-embed = "8.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
strixmaid-core = { version = "0.1.0", path = "../strixmaid-core" }
strixmaid-node = { version = "0.1.0", path = "../strixmaid-node" }
strixmaid-types = { version = "0.1.0", path = "../strixmaid-types" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "net", "sync", "time", "io-util"] }
# Agent 模式拨号回上级 Server 的那条 WS（三个平台都要）。
tokio-tungstenite = "0.30.0"
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["trace", "compression-gzip", "cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa = { version = "5.5.0", features = ["axum_extras"] }
utoipa-axum = "0.2.0"
utoipa-scalar = { version = "0.3.0", features = ["axum"] }

# Windows 服务（SCM）：`strixmaid service run` 由 SCM 拉起时要向它报告状态
# 并接受停止请求，`service install` 等子命令反过来调用 SCM。见 src/service/。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Services",
] }


# 版本资源与应用程序清单（见 build.rs 的 “Windows 资源” 一节）。
# cfg 按**宿主**匹配，Linux / macOS 上的构建不会拉到它。
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.11"
