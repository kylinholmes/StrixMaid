# CI（roadmap/06 §3.6）。
#
# 与方案的一处偏离：不跑 `cargo fmt --check`——仓库历史上不是 rustfmt-clean
# （docs/HANDOFF.md §4），全量格式化会制造噪声 diff，fmt 不在质量门槛里。
name: ci

on:
  push:
    # ci/** :打包与发布物相关的分支推上来就跑全流程,不必等 PR
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: clippy（零警告是质量门槛）
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: clippy（无 UI 变体也必须干净）
        run: cargo clippy -p strixmaid-server --no-default-features --all-targets -- -D warnings
      - name: test
        run: |
          cargo build -p strixmaid-server -p strixmaid-helper
          cargo test --workspace

  build-musl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: musl 工具链
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # web/dist 虽然提交在仓库里(本地无 bun 也能 cargo build),但那只是快照,
      # 会落后于 web/src——曾经发生过:deb 装出来的 UI 停在几十个提交之前。
      # 发布物的前端必须在这里现场构建,覆盖掉快照再嵌入。
      - uses: oven-sh/setup-bun@v2
      - name: 构建前端(嵌入用,覆盖仓库里的 dist 快照)
        run: |
          cd web
          bun install --frozen-lockfile
          bun run build
      - name: 静态构建
        run: cargo build --release --target x86_64-unknown-linux-musl -p strixmaid-server -p strixmaid-agent
      - name: 断言静态链接
        # Rust 的 musl 目标默认产出 static-pie，file 对它的措辞是 "static-pie linked"
        # 而非 "statically linked"——两种都算静态。真正要挡的是 "dynamically linked"，
        # 所以正面匹配之外再显式否定一次，避免哪天措辞再变就悄悄放行。
        run: |
          for bin in strixmaid strixmaid-agent; do
            f="target/x86_64-unknown-linux-musl/release/$bin"
            desc=$(file "$f")
            echo "$desc"
            case "$desc" in
              *"dynamically linked"*) echo "$f 是动态链接"; exit 1 ;;
              *"static-pie linked"*|*"statically linked"*) ;;
              *) echo "$f 的链接方式无法判定，file 说：$desc"; exit 1 ;;
            esac
          done
      - uses: actions/upload-artifact@v4
        with:
          name: strixmaid-musl-x86_64
          path: |
            target/x86_64-unknown-linux-musl/release/strixmaid
            target/x86_64-unknown-linux-musl/release/strixmaid-agent

  build-helper:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # build.rs 有意用 `-l:libpam.so.0`（不必装 dev 包提供 .so 符号链接，见其头注释），
      # 但 zig 的 sysroot 里没有 libpam，ld.lld 找不到它。把宿主的 libpam.so.0 单独
      # 拷进一个只有它的目录再 -L 过去——**不能**直接 -L 宿主的 multiarch 目录，
      # 那里还躺着宿主的 glibc 2.39，会把 2.28 的目标基线毁掉。
      # 链接期只取 SONAME 与符号表，运行期解析的是目标系统自己的 libpam。
      - name: 备好 libpam 的链接目标
        run: |
          mkdir -p /tmp/pamlib
          cp -L /usr/lib/x86_64-linux-gnu/libpam.so.0 /tmp/pamlib/libpam.so.0
          ls -l /tmp/pamlib
      - name: zigbuild（glibc 2.28 基线：Debian 10 / RHEL 8）
        # 按绝对路径链而不是 `-l:libpam.so.0`：zig 那套 clang/lld 包装还原不出
        # GNU ld 的 `-l:` 语法，即使 -L 指到了确有该文件的目录也报找不到。
        # DT_NEEDED 记的是 SONAME 不是路径，下一步的 ldd 断言会验掉这点。
        env:
          STRIXMAID_PAM_LINK_ARG: /tmp/pamlib/libpam.so.0
        run: |
          pip install cargo-zigbuild
          cargo zigbuild --release --target x86_64-unknown-linux-gnu.2.28 -p strixmaid-helper
      - name: 断言只链 libpam 与 libc 系
        # 看 DT_NEEDED，不用 ldd。ldd 展开的是整棵**传递**闭包，里面混着宿主
        # libpam 自己的依赖（Ubuntu 的 libpam 链了 libaudit、libcap-ng），那些
        # 跟「我们链了什么」无关——目标机上由它自己的 libpam 决定拖谁进来。
        # 顺带这也验掉了按绝对路径链的风险：若 SONAME 没被采用，DT_NEEDED 会
        # 变成构建机的路径，装到别的机器上就找不到库——看着能链成，实际不可交付。
        run: |
          f=target/x86_64-unknown-linux-gnu/release/strixmaid-helper
          readelf -d "$f" | grep NEEDED
          needed=$(readelf -d "$f" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p')
          bad=$(printf '%s\n' "$needed" \
            | grep -vE '^(libpam\.so\.0|libc\.so\.6|libm\.so\.6|libdl\.so\.2|libpthread\.so\.0|librt\.so\.1)$' || true)
          [ -z "$bad" ] || { echo "多余的直接依赖：$bad"; exit 1; }
          printf '%s\n' "$needed" | grep -qx 'libpam\.so\.0' \
            || { echo "DT_NEEDED 里没有 SONAME libpam.so.0（按绝对路径链时 SONAME 没被采用？）"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: strixmaid-helper-gnu228
          path: target/x86_64-unknown-linux-gnu/release/strixmaid-helper

  # 组装可安装的发布物（roadmap/06 §3.5）。与 scripts/package.sh 的产物同构，
  # 区别只在二进制来自上面两个 job 而不是本地工具链——CI 是唯一同时具备
  # musl-tools 与 zigbuild 的环境（开发机两样都没有，见 HANDOFF-2026-08-28 §3）。
  # 07 验证（root 容器）直接下载这个产物，无需在被测机器上编译。
  package:
    needs: [build-musl, build-helper]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 组装发布目录
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          out="strixmaid-$version-x86_64"
          mkdir -p "$out/packaging/pam.d"
          install -m 0755 artifacts/strixmaid-musl-x86_64/strixmaid        "$out/"
          install -m 0755 artifacts/strixmaid-musl-x86_64/strixmaid-agent  "$out/"
          install -m 0755 artifacts/strixmaid-helper-gnu228/strixmaid-helper "$out/"
          install -m 0755 packaging/install.sh "$out/packaging/"
          install -m 0644 packaging/strixmaid.service packaging/strixmaid-agent.service "$out/packaging/"
          install -m 0644 packaging/pam.d/strixmaid.debian packaging/pam.d/strixmaid.rhel "$out/packaging/pam.d/"
          install -m 0644 LICENSE "$out/"
          tar -czf "$out.tar.gz" "$out"
          ls -l "$out.tar.gz"
      - name: 自检发布物完整（缺一个文件 install.sh 就会半路失败）
        run: |
          out=$(ls -d strixmaid-*-x86_64)
          for f in strixmaid strixmaid-agent strixmaid-helper \
                   packaging/install.sh packaging/strixmaid.service \
                   packaging/strixmaid-agent.service \
                   packaging/pam.d/strixmaid.debian packaging/pam.d/strixmaid.rhel; do
            [ -e "$out/$f" ] || { echo "发布物缺 $f"; exit 1; }
          done
          [ -x "$out/strixmaid" ] && [ -x "$out/packaging/install.sh" ] || { echo "可执行位丢了"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: strixmaid-dist-x86_64
          path: strixmaid-*-x86_64.tar.gz

  # Ubuntu/Debian 包（scripts/package-deb.sh）。二进制与 tar.gz 发布物同源:
  # server/agent 来自 build-musl(静态),helper 来自 build-helper(glibc 2.28)。
  # 版本号带 git 短 sha,同一 Cargo 版本的多次构建可区分。
  deb:
    needs: [build-musl, build-helper]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 组装 deb
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          debver="${version}+git$(git rev-parse --short HEAD)"
          mkdir -p bins
          install -m 0755 artifacts/strixmaid-musl-x86_64/strixmaid          bins/
          install -m 0755 artifacts/strixmaid-musl-x86_64/strixmaid-agent    bins/
          install -m 0755 artifacts/strixmaid-helper-gnu228/strixmaid-helper bins/
          scripts/package-deb.sh --bins bins --version "$debver" --out dist-deb
      - name: 包内容自检
        run: |
          for deb in dist-deb/*.deb; do
            echo "== $deb"
            dpkg-deb --info "$deb"
            dpkg-deb --contents "$deb"
          done
          # 主包必须带 unit、pam.d conffile 与两个二进制
          c=$(dpkg-deb --contents dist-deb/strixmaid_*.deb)
          for f in ./usr/bin/strixmaid ./usr/bin/strixmaid-helper \
                   ./lib/systemd/system/strixmaid.service ./etc/pam.d/strixmaid; do
            echo "$c" | grep -q " $f\$" || { echo "deb 缺 $f"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: strixmaid-deb-amd64
          path: dist-deb/*.deb

  # deb 真装真跑:GitHub 的 runner 本身就是带 systemd 的 Ubuntu VM,
  # apt 安装 → 起服务 → API 应答 → 卸载/purge 干净,整条路径都验。
  deb-smoke:
    needs: [deb]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: strixmaid-deb-amd64
      - name: apt 安装(走依赖解析,顺带验 Depends 声明)
        run: |
          sudo apt-get update
          sudo apt-get install -y ./strixmaid_*_amd64.deb ./strixmaid-agent_*_amd64.deb
      - name: 安装后自检
        run: |
          strixmaid --version
          test -e /etc/strixmaid/config.toml || { echo "postinst 没生成配置"; exit 1; }
          test -e /etc/pam.d/strixmaid || { echo "缺 pam.d"; exit 1; }
          dpkg -L strixmaid-agent | grep -q '/usr/bin/strixmaid-agent'
      - name: agent 无配置时被条件拦下,不是崩溃循环
        # 用户实测踩过:没配 server_url 时 agent 每 2 秒崩一次刷日志。
        # 现在 unit 有 ConditionPathExists,start 应当直接跳过(inactive)。
        run: |
          sudo systemctl start strixmaid-agent
          sleep 2
          state=$(systemctl is-active strixmaid-agent || true)
          [ "$state" = "inactive" ] || { echo "预期 inactive(条件拦截),实际 $state"; systemctl status strixmaid-agent --no-pager || true; exit 1; }
      - name: 服务能起、API 能应答
        run: |
          sudo systemctl start strixmaid
          ok=0
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:9700/api/v1/capabilities >/dev/null && { ok=1; break; }
            sleep 1
          done
          [ "$ok" = 1 ] || { sudo journalctl -u strixmaid --no-pager | tail -50; exit 1; }
          curl -sf http://127.0.0.1:9700/api/v1/capabilities | head -c 300; echo
          sudo systemctl stop strixmaid
      - name: 卸载与 purge 干净
        run: |
          sudo apt-get remove -y strixmaid strixmaid-agent
          test -e /etc/strixmaid/config.toml || { echo "remove 不该删配置"; exit 1; }
          sudo apt-get purge -y strixmaid
          test ! -e /etc/strixmaid/config.toml || { echo "purge 后配置还在"; exit 1; }

  # roadmap/07 的 root 环境验收（§1.2 / §5 / 05 §5.2）。
  #
  # 为什么值得每次 PR 都跑：07 第一次真跑就掉出一个**只在 RHEL 系上出现**的缺陷
  # （journalctl 的 "insufficient permissions" 被归成 internal，普通用户打开日志页
  # 得到 500）。它在 Ubuntu 上永远复现不了——那里 journald 的 ACL 让用户至少打得开
  # 自己的日志。这类「换个发行版才现形」的问题，只有跑在矩阵里才防得住回归。
  #
  # runner 本身就是带 root 与 docker 的 Ubuntu VM，跑法与开发者本机完全一致。
  # 不能搬进来的仍是不能搬：浏览器渲染（§2）、7 天长测（§3）、release 计时（§4）、
  # 以及 #15/#16 的 300s/900s 空闲超时（LONG=1，另行安排定时任务，不塞进 PR）。
  verify:
    needs: [package]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false          # 一个发行版挂了要看另一个的结果，那才知道是不是发行版相关
      matrix:
        distro: [ubuntu, rocky]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: strixmaid-dist-x86_64
      - name: 解包
        run: |
          tar xzf strixmaid-*-x86_64.tar.gz
          echo "DIST=$(ls -d strixmaid-*-x86_64)" >> "$GITHUB_ENV"
      - name: 07 验收（${{ matrix.distro }}）
        run: scripts/verify/run-in-docker.sh --dist "$DIST" --distro ${{ matrix.distro }}

  size:
    needs: [build-musl, build-helper]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
      - name: 体积上限（design.md Q3 / roadmap/06 §5.2）
        run: |
          check() { s=$(stat -c%s "$1"); echo "$1: $s bytes"; [ "$s" -le "$2" ] || { echo "超出上限 $2"; exit 1; }; }
          check strixmaid-musl-x86_64/strixmaid            $((15 * 1024 * 1024))
          check strixmaid-musl-x86_64/strixmaid-agent      $(( 8 * 1024 * 1024))
          check strixmaid-helper-gnu228/strixmaid-helper   $(( 1 * 1024 * 1024))
