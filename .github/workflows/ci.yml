# CI（roadmap/06 §3.6）。
#
# 与方案的一处偏离：不跑 `cargo fmt --check`——仓库历史上不是 rustfmt-clean
# （docs/HANDOFF.md §4），全量格式化会制造噪声 diff，fmt 不在质量门槛里。
name: ci

on:
  push:
    # ci/** :打包与发布物相关的分支推上来就跑全流程,不必等 PR
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # 前端的质量门槛，以及整条 workflow 里**唯一一次**前端构建。
  #
  # web/dist 不在 git 里（它是 web/src 的派生物，跟踪必然漂移——曾经发生过：
  # deb 装出来的 UI 停在几十个提交之前）。而 rust-embed 的 `folder` 在 **debug 下
  # 同样**于编译期求值，目录不存在就直接报 "folder does not exist"，所以凡是要编
  # strixmaid 的 job 都得先有 web/dist，不只是出包那几个。原先每个这样的
  # job 各自构建一遍，同一份产物在一次 workflow 里被算了四次；现在集中在这里构建
  # 一次，下游用 artifact 取走。
  #
  # 顺带把前端真正的门槛补上：`bun run build` 里的 `tsc -b` 只覆盖类型这一条，
  # biome（`check`）与 vitest（`test`）以前在整个 workflow 里一次都没跑过。
  # 三条分成三个 step 而不是串进一个 run，是为了挂的时候一眼看出挂在哪一条。
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: 安装依赖
        working-directory: web
        run: bun install --frozen-lockfile
      - name: biome（格式与 lint）
        working-directory: web
        run: bun run check
      - name: 类型检查
        working-directory: web
        run: bun run typecheck
      - name: vitest
        working-directory: web
        run: bun run test
      - name: 构建
        working-directory: web
        run: bun run build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          # 产物为空就直接失败：下游 job 拿到一个空目录时，报出来的会是 rust-embed
          # 或者 SPA 回退 404 之类离原因很远的症状。
          if-no-files-found: error

  # 三个平台共用同一套质量门槛：零 clippy 警告、全部测试通过。
  #
  # Windows 与 macOS 都是正式支持的运行平台而不是「顺带能编」，所以门槛与 Linux
  # 完全相同（docs/windows-platform.md、docs/macos-platform.md）。
  #
  # 原先 Linux 与 Windows 是两个彼此独立的 job，理由是「一边挂了另一边的结果仍然
  # 有用」。矩阵保住了这一点，靠的是 `fail-fast: false`（与下面 verify 的发行版矩阵
  # 同一个写法）：某个平台挂掉不会取消其余平台，三份结果都看得到。换来的是再加一个
  # 平台不必复制一整个 job。
  #
  # 平台特有的那两步用 `if:` 挂在矩阵里，不为它们拆回独立 job：
  #   - 无 UI 变体的 clippy 与平台无关（`--no-default-features` 只关掉 rust-embed 那条
  #     路径），跑一个平台就够，三个平台各跑一遍只是重复；
  #   - PowerShell 5.1 的解析检查只有 Windows runner 上才有那个宿主。
  #
  # 共享的只是**门槛**，不是打包：发布物的形态本来就三样（Windows 无 PAM、服务走
  # SCM、资源要 rc.exe；Linux 要 musl 静态与 glibc 2.28 基线；macOS 走 launchd 且只出
  # Apple Silicon），所以下面每个平台仍是各自一条打包的路。
  #
  # 需要真实系统能力的测试（ConPTY、事件日志、以管理员身份改系统设置）一律写成
  # 运行时探测 + eprintln 跳过，不用 #[ignore]，所以在 runner 上照跑不误。
  quality:
    needs: [frontend]
    strategy:
      fail-fast: false          # 一个平台挂了要看其余平台的结果，那才知道是不是平台相关
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # web/dist 不在 git 里，而 rust-embed 的 folder 在 **debug 下同样**要求目录
      # 存在（理由见 frontend job），所以碰 cargo 之前先把前端产物取回来。
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - name: clippy（零警告是质量门槛）
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: clippy（无 UI 变体也必须干净）
        if: matrix.os == 'ubuntu-24.04'
        run: cargo clippy -p strixmaid --no-default-features --all-targets -- -D warnings
      # 先 build 再 test：有用例会 spawn 真实的 helper 与 worker 可执行文件，
      # 它们得先存在于 target 目录里。
      - name: build
        run: cargo build --workspace
      - name: test
        run: cargo test --workspace
      # 结构性验收（scripts/acceptance.sh 的静态部分）。接进 CI 是 2026-09-17 补的：
      # 此前它只在人手动跑时才执行，结果是——路径在 node 抽取后指着已经搬走的目录、
      # 「路由不得持有 provider」那条在图标功能落地后就与设计不符，两件事都没人发现。
      # 一个没人跑的检查比没有检查更糟：它提供的是假的保证。
      #
      # 只在 ubuntu 上跑：断言的是仓库结构，与平台无关，三个平台各跑一遍是浪费。
      # 需要 token 的动态部分会自行跳过（报「未测」，不计失败）。
      - name: 结构性验收
        if: matrix.os == 'ubuntu-24.04'
        run: bash scripts/acceptance.sh
      # 安装脚本必须在 Windows **自带**的 PowerShell 5.1 下可解析。
      # `shell: powershell` 就是 5.1（`pwsh` 才是 7），所以这一步同时钉住两件事：
      # 一是不用 7 才有的语法，二是文件编码——5.1 读没有 BOM 的 .ps1 时按系统
      # ANSI 代码页解码，中文注释会变成乱码并吞掉引号，直接报语法错误。
      - name: PowerShell 脚本语法检查（5.1）
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $files = @(
            'packaging\windows\install.ps1',
            'packaging\windows\uninstall.ps1',
            'scripts\package-windows.ps1'
          )
          $bad = 0
          foreach ($f in $files) {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $f).Path, [ref]$null, [ref]$errs)
            if ($errs -and $errs.Count) {
              $bad = 1
              Write-Host "FAIL $f"
              $errs | ForEach-Object { Write-Host "  行 $($_.Extent.StartLineNumber): $($_.Message)" }
            }
            else {
              Write-Host "OK   $f"
            }
          }
          if ($bad) { exit 1 }

  # Windows 发布 zip（scripts/package-windows.ps1）。与 Linux 侧的 package job
  # 同构，区别在于二进制就在本 job 里构建——Windows 的资源编译要 rc.exe
  # （Windows SDK），交叉编译拿不到，见 crates/*/build.rs 的说明。
  #
  # needs 从原先那个独立的 windows job 改成整个 quality 矩阵：GitHub 的 needs 只能
  # 挂在整个 job 上，挂不到单条矩阵腿。代价是任一平台的门槛挂掉都不出 zip——这是
  # 把门槛收紧而不是放松，可以接受；三个平台各自的结果仍然看得到（fail-fast: false）。
  package-windows:
    needs: [quality]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # 打包脚本自己会构建前端（web/dist 不在 git 里），这里只需把 bun 准备好。
      # 不在这里重复一次 bun run build、也不下载 frontend job 的 artifact：让本地
      # 跑脚本与 CI 跑脚本走完全同一条路，否则「CI 能出包、本地出的包是旧前端」
      # 这类差异会再次出现。这是「前端只构建一次」的**唯一例外**（macOS 侧同理），
      # 而且是刻意的——要去掉它就得改脚本，可脚本正是本地出包的唯一入口。
      - uses: oven-sh/setup-bun@v2
      - name: 组装 zip（脚本内含前端构建）
        run: ./scripts/package-windows.ps1
      - name: 包内容自检（缺一个文件 install.ps1 就会半路失败）
        run: |
          $zip = Get-Item strixmaid-*-x86_64-windows.zip
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName)
          try {
            # Compress-Archive 在不同版本里写过反斜杠分隔符，统一成 / 再比。
            $entries = $archive.Entries.FullName | ForEach-Object { $_ -replace '\\', '/' }
          }
          finally {
            $archive.Dispose()
          }
          $entries
          $need = @(
            'strixmaid.exe', 'strixmaid-helper.exe', 'config.example.toml',
            'README.md', 'LICENSE',
            'packaging/install.ps1', 'packaging/uninstall.ps1'
          )
          foreach ($f in $need) {
            if (-not ($entries | Where-Object { $_ -like "*/$f" })) {
              Write-Host "发布物缺 $f"
              exit 1
            }
          }
      - name: 示例配置不带 BOM（TOML 不允许，带了就解析不了）
        run: |
          $zip = Get-Item strixmaid-*-x86_64-windows.zip
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName)
          try {
            $entry = $archive.Entries | Where-Object { $_.Name -eq 'config.example.toml' }
            $stream = $entry.Open()
            $buf = New-Object byte[] 3
            $null = $stream.Read($buf, 0, 3)
            $stream.Dispose()
          }
          finally {
            $archive.Dispose()
          }
          if ($buf[0] -eq 0xEF -and $buf[1] -eq 0xBB -and $buf[2] -eq 0xBF) {
            Write-Host 'config.example.toml 带了 UTF-8 BOM，TOML 解析器会直接拒绝'
            exit 1
          }
      - uses: actions/upload-artifact@v7
        with:
          name: strixmaid-windows-x86_64
          path: strixmaid-*-x86_64-windows.zip

  # macOS 只出 Apple Silicon（aarch64-apple-darwin）：不做 Intel、不做 universal、
  # 暂不签名公证。macos-latest 本身就是 arm64 runner，原生构建，不涉及交叉工具链。
  #
  # 位置与 build-musl 相同：先把二进制构建出来、把架构断言钉在这里，打包是下一个
  # job 的事。一个 job 只挂一件事，看 job 名就知道是编译挂了还是组装挂了。
  build-macos:
    needs: [frontend]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          # 与 package-macos 共用一份缓存。那个 job 会由打包脚本再走一遍同样的
          # release 构建（刻意如此，见其说明），共用缓存至少免掉依赖那一大半。
          shared-key: macos-release
      # 与 quality / build-musl 同一个理由：release 下 rust-embed 要把 web/dist 嵌进
      # 二进制，产物必须先就位。取 frontend job 构建好的那一份，不再自己构建一遍。
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - name: 构建（release）
        run: cargo build --release --target aarch64-apple-darwin -p strixmaid -p strixmaid-helper
      - name: 断言只有 arm64（不做 universal，也不许混进 x86_64）
        # lipo -archs 对单架构二进制只输出一个词。哪天误开了 universal、或者误用了
        # x86_64 目标，这里立刻报出来，而不是等用户装完发现体积翻倍或者跑不起来。
        run: |
          for bin in strixmaid strixmaid-helper; do
            f="target/aarch64-apple-darwin/release/$bin"
            archs=$(lipo -archs "$f")
            echo "$f: $archs"
            [ "$archs" = "arm64" ] || { echo "$f 的架构是「$archs」，预期只有 arm64"; exit 1; }
          done
      - uses: actions/upload-artifact@v7
        with:
          name: strixmaid-macos-aarch64
          path: |
            target/aarch64-apple-darwin/release/strixmaid
            target/aarch64-apple-darwin/release/strixmaid-helper

  # macOS 发布 tar.gz（scripts/package-macos.sh）。产物命名与布局与 Linux 侧的
  # package job 同构，换平台的人不必重新认路。
  #
  # 与 package-windows 是同一处取舍：打包脚本自己构建（前端与 cargo 都在脚本里），
  # 本 job **不**把 build-macos 的二进制喂进去，为的是本地出包与 CI 出包走完全同
  # 一条路。build-macos 的存在不是为它准备输入，而是把架构断言与裸二进制产物钉在
  # 一个独立 job 里，一如 build-musl 之于 package。
  package-macos:
    needs: [quality, build-macos]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-release
      # 前端同样由脚本构建（与 package-windows 一致），这里只把 bun 准备好。
      - uses: oven-sh/setup-bun@v2
      - name: 组装 tar.gz（脚本内含前端与 cargo 构建）
        run: scripts/package-macos.sh
      - name: 包内容自检（缺一个文件要等装到一半才发现）
        # 文件名里的版本号取自 Cargo.toml，这里不重复解析一遍，用通配符对上即可。
        run: |
          tar xzf strixmaid-*-aarch64*.tar.gz
          out=$(find . -maxdepth 1 -type d -name 'strixmaid-*-aarch64*' | head -1)
          [ -n "$out" ] || { echo "tar.gz 里没有预期的顶层目录"; exit 1; }
          ls -lR "$out"
          for f in strixmaid strixmaid-helper LICENSE; do
            [ -e "$out/$f" ] || { echo "发布物缺 $f"; exit 1; }
          done
          [ -x "$out/strixmaid" ] || { echo "可执行位丢了"; exit 1; }
          # 包里的那一份也验一次架构：build-macos 验的是 target 目录里的产物，
          # 而真正交付出去的是这一份，中间隔着一次脚本自己的构建。
          archs=$(lipo -archs "$out/strixmaid")
          echo "包内 strixmaid: $archs"
          [ "$archs" = "arm64" ] || { echo "包里的 strixmaid 架构是「$archs」，预期只有 arm64"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: strixmaid-dist-aarch64-macos
          path: strixmaid-*-aarch64*.tar.gz

  build-musl:
    needs: [frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: musl 工具链
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # web/dist 不在 git 里(它是 web/src 的派生物,跟踪必然漂移——曾经发生过:
      # deb 装出来的 UI 停在几十个提交之前)。本 job 直接调 cargo 而不走
      # scripts/package.sh,所以要先把前端产物摆到位,否则 release 下 rust-embed
      # 嵌不到东西、构建会失败。取 frontend job 那一份,不再自己构建一遍。
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - name: 静态构建
        run: cargo build --release --target x86_64-unknown-linux-musl -p strixmaid
      - name: 断言静态链接
        # Rust 的 musl 目标默认产出 static-pie，file 对它的措辞是 "static-pie linked"
        # 而非 "statically linked"——两种都算静态。真正要挡的是 "dynamically linked"，
        # 所以正面匹配之外再显式否定一次，避免哪天措辞再变就悄悄放行。
        run: |
          for bin in strixmaid; do
            f="target/x86_64-unknown-linux-musl/release/$bin"
            desc=$(file "$f")
            echo "$desc"
            case "$desc" in
              *"dynamically linked"*) echo "$f 是动态链接"; exit 1 ;;
              *"static-pie linked"*|*"statically linked"*) ;;
              *) echo "$f 的链接方式无法判定，file 说：$desc"; exit 1 ;;
            esac
          done
      - uses: actions/upload-artifact@v7
        with:
          name: strixmaid-musl-x86_64
          path: |
            target/x86_64-unknown-linux-musl/release/strixmaid

  # 本 job 不需要 web/dist：rust-embed 只在 strixmaid 里，helper 不嵌前端，
  # 所以它也不依赖 frontend job。
  build-helper:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # build.rs 有意用 `-l:libpam.so.0`（不必装 dev 包提供 .so 符号链接，见其头注释），
      # 但 zig 的 sysroot 里没有 libpam，ld.lld 找不到它。把宿主的 libpam.so.0 单独
      # 拷进一个只有它的目录再 -L 过去——**不能**直接 -L 宿主的 multiarch 目录，
      # 那里还躺着宿主的 glibc 2.39，会把 2.28 的目标基线毁掉。
      # 链接期只取 SONAME 与符号表，运行期解析的是目标系统自己的 libpam。
      - name: 备好 libpam 的链接目标
        run: |
          mkdir -p /tmp/pamlib
          cp -L /usr/lib/x86_64-linux-gnu/libpam.so.0 /tmp/pamlib/libpam.so.0
          ls -l /tmp/pamlib
      - name: zigbuild（glibc 2.28 基线：Debian 10 / RHEL 8）
        # 按绝对路径链而不是 `-l:libpam.so.0`：zig 那套 clang/lld 包装还原不出
        # GNU ld 的 `-l:` 语法，即使 -L 指到了确有该文件的目录也报找不到。
        # DT_NEEDED 记的是 SONAME 不是路径，下一步的 ldd 断言会验掉这点。
        env:
          STRIXMAID_PAM_LINK_ARG: /tmp/pamlib/libpam.so.0
        run: |
          pip install cargo-zigbuild
          cargo zigbuild --release --target x86_64-unknown-linux-gnu.2.28 -p strixmaid-helper
      - name: 断言只链 libpam 与 libc 系
        # 看 DT_NEEDED，不用 ldd。ldd 展开的是整棵**传递**闭包，里面混着宿主
        # libpam 自己的依赖（Ubuntu 的 libpam 链了 libaudit、libcap-ng），那些
        # 跟「我们链了什么」无关——目标机上由它自己的 libpam 决定拖谁进来。
        # 顺带这也验掉了按绝对路径链的风险：若 SONAME 没被采用，DT_NEEDED 会
        # 变成构建机的路径，装到别的机器上就找不到库——看着能链成，实际不可交付。
        run: |
          f=target/x86_64-unknown-linux-gnu/release/strixmaid-helper
          readelf -d "$f" | grep NEEDED
          needed=$(readelf -d "$f" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p')
          bad=$(printf '%s\n' "$needed" \
            | grep -vE '^(libpam\.so\.0|libc\.so\.6|libm\.so\.6|libdl\.so\.2|libpthread\.so\.0|librt\.so\.1)$' || true)
          [ -z "$bad" ] || { echo "多余的直接依赖：$bad"; exit 1; }
          printf '%s\n' "$needed" | grep -qx 'libpam\.so\.0' \
            || { echo "DT_NEEDED 里没有 SONAME libpam.so.0（按绝对路径链时 SONAME 没被采用？）"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: strixmaid-helper-gnu228
          path: target/x86_64-unknown-linux-gnu/release/strixmaid-helper

  # 组装可安装的发布物（roadmap/06 §3.5）。与 scripts/package.sh 的产物同构，
  # 区别只在二进制来自上面两个 job 而不是本地工具链——CI 是唯一同时具备
  # musl-tools 与 zigbuild 的环境（开发机两样都没有，见 HANDOFF-2026-08-28 §3）。
  # 07 验证（root 容器）直接下载这个产物，无需在被测机器上编译。
  package:
    needs: [build-musl, build-helper]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # 按名字逐个取，不整个 download：本 job 只要两个 build job 的裸二进制，
      # 前端与 macOS 的产物拖下来也用不上。
      - uses: actions/download-artifact@v8
        with:
          name: strixmaid-musl-x86_64
          path: artifacts/strixmaid-musl-x86_64
      - uses: actions/download-artifact@v8
        with:
          name: strixmaid-helper-gnu228
          path: artifacts/strixmaid-helper-gnu228
      - name: 组装发布目录
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          out="strixmaid-$version-x86_64"
          mkdir -p "$out/packaging/pam.d"
          install -m 0755 artifacts/strixmaid-musl-x86_64/strixmaid        "$out/"
          install -m 0755 artifacts/strixmaid-helper-gnu228/strixmaid-helper "$out/"
          install -m 0755 packaging/install.sh "$out/packaging/"
          install -m 0644 packaging/strixmaid.service packaging/strixmaid-agent.service "$out/packaging/"
          install -m 0644 packaging/pam.d/strixmaid.debian packaging/pam.d/strixmaid.rhel "$out/packaging/pam.d/"
          install -m 0644 LICENSE "$out/"
          tar -czf "$out.tar.gz" "$out"
          ls -l "$out.tar.gz"
      - name: 自检发布物完整（缺一个文件 install.sh 就会半路失败）
        run: |
          out=$(ls -d strixmaid-*-x86_64)
          for f in strixmaid strixmaid-helper \
                   packaging/install.sh packaging/strixmaid.service \
                   packaging/strixmaid-agent.service \
                   packaging/pam.d/strixmaid.debian packaging/pam.d/strixmaid.rhel; do
            [ -e "$out/$f" ] || { echo "发布物缺 $f"; exit 1; }
          done
          [ -x "$out/strixmaid" ] && [ -x "$out/packaging/install.sh" ] || { echo "可执行位丢了"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: strixmaid-dist-x86_64
          path: strixmaid-*-x86_64.tar.gz

  # Ubuntu/Debian 包（scripts/package-deb.sh）。二进制与 tar.gz 发布物同源:
  # server/agent 来自 build-musl(静态),helper 来自 build-helper(glibc 2.28)。
  # 版本号带 git 短 sha,同一 Cargo 版本的多次构建可区分。
  deb:
    needs: [build-musl, build-helper]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # 同 package job：只取两个 build job 的裸二进制。
      - uses: actions/download-artifact@v8
        with:
          name: strixmaid-musl-x86_64
          path: artifacts/strixmaid-musl-x86_64
      - uses: actions/download-artifact@v8
        with:
          name: strixmaid-helper-gnu228
          path: artifacts/strixmaid-helper-gnu228
      - name: 组装 deb
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          debver="${version}+git$(git rev-parse --short HEAD)"
          mkdir -p bins
          install -m 0755 artifacts/strixmaid-musl-x86_64/strixmaid          bins/
          install -m 0755 artifacts/strixmaid-helper-gnu228/strixmaid-helper bins/
          scripts/package-deb.sh --bins bins --version "$debver" --out dist-deb
      - name: 包内容自检
        run: |
          for deb in dist-deb/*.deb; do
            echo "== $deb"
            dpkg-deb --info "$deb"
            dpkg-deb --contents "$deb"
          done
          # 主包必须带 unit、pam.d conffile 与两个二进制
          c=$(dpkg-deb --contents dist-deb/strixmaid_*.deb)
          for f in ./usr/bin/strixmaid ./usr/bin/strixmaid-helper \
                   ./lib/systemd/system/strixmaid.service ./etc/pam.d/strixmaid; do
            echo "$c" | grep -q " $f\$" || { echo "deb 缺 $f"; exit 1; }
          done
      - uses: actions/upload-artifact@v7
        with:
          name: strixmaid-deb-amd64
          path: dist-deb/*.deb

  # deb 真装真跑:GitHub 的 runner 本身就是带 systemd 的 Ubuntu VM,
  # apt 安装 → 起服务 → API 应答 → 卸载/purge 干净,整条路径都验。
  deb-smoke:
    needs: [deb]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: strixmaid-deb-amd64
      - name: apt 安装(走依赖解析,顺带验 Depends 声明)
        run: |
          sudo apt-get update
          sudo apt-get install -y ./strixmaid_*_amd64.deb ./strixmaid-agent_*_amd64.deb
      - name: 安装后自检
        run: |
          strixmaid --version
          test -e /etc/strixmaid/config.toml || { echo "postinst 没生成配置"; exit 1; }
          test -e /etc/pam.d/strixmaid || { echo "缺 pam.d"; exit 1; }
          # agent 包不带二进制（与 server 是同一个可执行文件的两种模式），
          # 它装的是 unit 与示例配置，二进制由 Depends 拉来的 strixmaid 提供。
          dpkg -L strixmaid-agent | grep -q '/lib/systemd/system/strixmaid-agent.service'
          dpkg -L strixmaid-agent | grep -q 'agent.toml.example'
          test -x /usr/bin/strixmaid
      - name: agent 无配置时被条件拦下,不是崩溃循环
        # 用户实测踩过:没配 server_url 时 agent 每 2 秒崩一次刷日志。
        # 现在 unit 有 ConditionPathExists,start 应当直接跳过(inactive)。
        run: |
          sudo systemctl start strixmaid-agent
          sleep 2
          state=$(systemctl is-active strixmaid-agent || true)
          [ "$state" = "inactive" ] || { echo "预期 inactive(条件拦截),实际 $state"; systemctl status strixmaid-agent --no-pager || true; exit 1; }
      - name: 服务能起、API 能应答
        run: |
          sudo systemctl start strixmaid
          ok=0
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:9700/api/v1/capabilities >/dev/null && { ok=1; break; }
            sleep 1
          done
          [ "$ok" = 1 ] || { sudo journalctl -u strixmaid --no-pager | tail -50; exit 1; }
          curl -sf http://127.0.0.1:9700/api/v1/capabilities | head -c 300; echo
          sudo systemctl stop strixmaid
      - name: 卸载与 purge 干净
        run: |
          sudo apt-get remove -y strixmaid strixmaid-agent
          test -e /etc/strixmaid/config.toml || { echo "remove 不该删配置"; exit 1; }
          sudo apt-get purge -y strixmaid
          test ! -e /etc/strixmaid/config.toml || { echo "purge 后配置还在"; exit 1; }

  # roadmap/07 的 root 环境验收（§1.2 / §5 / 05 §5.2）。
  #
  # 为什么值得每次 PR 都跑：07 第一次真跑就掉出一个**只在 RHEL 系上出现**的缺陷
  # （journalctl 的 "insufficient permissions" 被归成 internal，普通用户打开日志页
  # 得到 500）。它在 Ubuntu 上永远复现不了——那里 journald 的 ACL 让用户至少打得开
  # 自己的日志。这类「换个发行版才现形」的问题，只有跑在矩阵里才防得住回归。
  #
  # runner 本身就是带 root 与 docker 的 Ubuntu VM，跑法与开发者本机完全一致。
  # 不能搬进来的仍是不能搬：浏览器渲染（§2）、7 天长测（§3）、release 计时（§4）、
  # 以及 #15/#16 的 300s/900s 空闲超时（LONG=1，另行安排定时任务，不塞进 PR）。
  verify:
    needs: [package]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false          # 一个发行版挂了要看另一个的结果，那才知道是不是发行版相关
      matrix:
        distro: [ubuntu, rocky]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: strixmaid-dist-x86_64
      - name: 解包
        run: |
          tar xzf strixmaid-*-x86_64.tar.gz
          echo "DIST=$(ls -d strixmaid-*-x86_64)" >> "$GITHUB_ENV"
      - name: 07 验收（${{ matrix.distro }}）
        run: scripts/verify/run-in-docker.sh --dist "$DIST" --distro ${{ matrix.distro }}

  size:
    needs: [build-musl, build-helper]
    runs-on: ubuntu-24.04
    steps:
      # 按名字取，不整个 download：这里只关心 Linux 两个 build job 的裸二进制，
      # 不必把前端产物与 macOS 产物也拖下来。
      - uses: actions/download-artifact@v8
        with:
          name: strixmaid-musl-x86_64
          path: strixmaid-musl-x86_64
      - uses: actions/download-artifact@v8
        with:
          name: strixmaid-helper-gnu228
          path: strixmaid-helper-gnu228
      - name: 体积上限（design.md Q3 / roadmap/06 §5.2）
        run: |
          check() { s=$(stat -c%s "$1"); echo "$1: $s bytes"; [ "$s" -le "$2" ] || { echo "超出上限 $2"; exit 1; }; }
          check strixmaid-musl-x86_64/strixmaid            $((18 * 1024 * 1024))
          check strixmaid-helper-gnu228/strixmaid-helper   $(( 1 * 1024 * 1024))
