# 静态 musl 构建（roadmap/06 §3.1）。
# x86_64 需要 musl-gcc（Debian/Ubuntu 包 musl-tools）：libsqlite3-sys 的 bundled
# sqlite 要编 C 源，缺它时 cc 会退回 gcc 产出 glibc 目标文件，链接必失败。
# aarch64 首选 cargo-zigbuild（cargo zigbuild --target aarch64-unknown-linux-musl），
# 免维护交叉工具链；下面的 linker 仅在手工装了 musl 交叉链时生效。

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]
linker = "aarch64-linux-musl-gcc"
